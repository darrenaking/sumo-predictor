name: Daily Sumo Update

on:
  schedule:
    # Run at 7pm JST (10:00 UTC) - after day's sumo finishes
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      basho_id:
        description: 'Tournament ID (YYYYMM, e.g., 202501)'
        required: true
        type: string
      day:
        description: 'Day number (1-15)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate pages
        run: |
          BASHO="${{ github.event.inputs.basho_id }}"
          DAY="${{ github.event.inputs.day }}"

          if [ -z "$BASHO" ]; then
            # Auto-detect current basho (odd months: 01, 03, 05, 07, 09, 11)
            YEAR=$(TZ=Asia/Tokyo date +%Y)
            MONTH=$(TZ=Asia/Tokyo date +%m)
            BASHO="${YEAR}${MONTH}"
          fi

          if [ -z "$DAY" ]; then
            # Generate all 15 days
            for d in $(seq 1 15); do
              echo "Generating day $d..."
              python -m src.companion.daily_pipeline --basho $BASHO --day $d --mode both || true
            done
          else
            python -m src.companion.daily_pipeline --basho $BASHO --day $DAY --mode both
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
