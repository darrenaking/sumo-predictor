name: Daily Update

on:
  # Run daily at 6am JST (9pm UTC previous day) during basho
  schedule:
    - cron: '0 21 * * *'

  # Allow manual trigger with inputs
  workflow_dispatch:
    inputs:
      basho:
        description: 'Tournament ID (YYYYMM)'
        required: true
        default: '202601'
      day:
        description: 'Day number (1-15)'
        required: true
        default: '1'
      mode:
        description: 'Generation mode'
        required: true
        default: 'both'
        type: choice
        options:
          - preview
          - results
          - both

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Calculate current day (for scheduled runs)
        id: calc_day
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Calculate day based on basho start date
            # January 2026 basho starts on Jan 12
            BASHO_START="2026-01-12"
            TODAY=$(date -u +%Y-%m-%d)
            DAY=$(( ($(date -d "$TODAY" +%s) - $(date -d "$BASHO_START" +%s)) / 86400 + 1 ))

            # Clamp to 1-15
            if [ $DAY -lt 1 ]; then DAY=1; fi
            if [ $DAY -gt 15 ]; then DAY=15; fi

            echo "basho=202601" >> $GITHUB_OUTPUT
            echo "day=$DAY" >> $GITHUB_OUTPUT
            echo "mode=both" >> $GITHUB_OUTPUT
          else
            echo "basho=${{ github.event.inputs.basho }}" >> $GITHUB_OUTPUT
            echo "day=${{ github.event.inputs.day }}" >> $GITHUB_OUTPUT
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Run daily pipeline
        run: |
          python -m src.companion.daily_pipeline \
            --basho ${{ steps.calc_day.outputs.basho }} \
            --day ${{ steps.calc_day.outputs.day }} \
            --mode ${{ steps.calc_day.outputs.mode }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add site/data/
          git diff --staged --quiet || git commit -m "Update day ${{ steps.calc_day.outputs.day }} data for ${{ steps.calc_day.outputs.basho }}"
          git push
