<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TachiAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white text-gray-900">
    <main class="max-w-2xl mx-auto px-4 py-12" id="app">
        <!-- App content rendered by JavaScript -->
        <div class="text-center text-gray-500">Loading...</div>
    </main>

    <script>
    // TachiAI Single-Page App
    const App = {
        state: {
            tournaments: [],
            currentBasho: null,
            currentDay: null,
            currentView: 'home', // 'home', 'preview', 'results'
            data: null
        },

        bashoNames: {
            '01': 'Hatsu Basho (January)',
            '03': 'Haru Basho (March)',
            '05': 'Natsu Basho (May)',
            '07': 'Nagoya Basho (July)',
            '09': 'Aki Basho (September)',
            '11': 'Kyushu Basho (November)'
        },

        getBashoName(bashoId) {
            const year = bashoId.slice(0, 4);
            const month = bashoId.slice(4);
            const name = this.bashoNames[month] || `Basho ${month}`;
            return `${year} ${name}`;
        },

        formatBashoDir(bashoId) {
            return `${bashoId.slice(0, 4)}-${bashoId.slice(4)}`;
        },

        async init() {
            // Parse URL hash for routing
            this.handleRoute();
            window.addEventListener('hashchange', () => this.handleRoute());

            // Load tournament index
            await this.loadIndex();
        },

        handleRoute() {
            const hash = window.location.hash.slice(1) || '';
            const parts = hash.split('/');

            if (parts.length >= 3) {
                // e.g. #202601/5/preview or #202601/5/results
                this.state.currentBasho = parts[0];
                this.state.currentDay = parseInt(parts[1]);
                this.state.currentView = parts[2] || 'preview';
            } else if (parts.length === 2) {
                this.state.currentBasho = parts[0];
                this.state.currentDay = parseInt(parts[1]);
                this.state.currentView = 'preview';
            } else {
                this.state.currentBasho = null;
                this.state.currentDay = null;
                this.state.currentView = 'home';
            }

            this.render();
        },

        navigate(basho, day, view) {
            if (basho && day) {
                window.location.hash = `${basho}/${day}/${view || 'preview'}`;
            } else {
                window.location.hash = '';
            }
        },

        async loadIndex() {
            try {
                const response = await fetch('data/index.json');
                if (response.ok) {
                    this.state.tournaments = await response.json();
                } else {
                    // Fallback: scan for data directories
                    this.state.tournaments = [];
                }
            } catch (e) {
                console.error('Failed to load index:', e);
                this.state.tournaments = [];
            }
            this.render();
        },

        async loadDayData(basho, day) {
            const dir = this.formatBashoDir(basho);
            const url = `data/${dir}/day-${String(day).padStart(2, '0')}.json`;

            try {
                const response = await fetch(url);
                if (response.ok) {
                    this.state.data = await response.json();
                } else {
                    this.state.data = null;
                }
            } catch (e) {
                console.error('Failed to load day data:', e);
                this.state.data = null;
            }
            this.render();
        },

        render() {
            const app = document.getElementById('app');

            if (this.state.currentView === 'home' || !this.state.currentBasho) {
                app.innerHTML = this.renderHome();
            } else if (this.state.currentBasho && this.state.currentDay) {
                // Load data if needed
                if (!this.state.data ||
                    this.state.data.basho_id !== this.state.currentBasho ||
                    this.state.data.day !== this.state.currentDay) {
                    app.innerHTML = '<div class="text-center text-gray-500">Loading...</div>';
                    this.loadDayData(this.state.currentBasho, this.state.currentDay);
                    return;
                }

                if (this.state.currentView === 'results') {
                    app.innerHTML = this.renderResults();
                } else {
                    app.innerHTML = this.renderPreview();
                }
            }

            // Bind click handlers
            this.bindEvents();
        },

        bindEvents() {
            // Day buttons
            document.querySelectorAll('[data-day]').forEach(el => {
                el.addEventListener('click', (e) => {
                    const basho = e.target.dataset.basho;
                    const day = parseInt(e.target.dataset.day);
                    this.navigate(basho, day, 'preview');
                });
            });

            // Navigation links
            document.querySelectorAll('[data-nav]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const nav = e.target.dataset.nav;
                    if (nav === 'home') {
                        this.navigate(null, null, null);
                    } else {
                        const [basho, day, view] = nav.split('/');
                        this.navigate(basho, parseInt(day), view);
                    }
                });
            });
        },

        renderHome() {
            if (this.state.tournaments.length === 0) {
                return `
                    <h1 class="text-3xl font-bold text-gray-900 mb-8">TachiAI</h1>
                    <p class="text-gray-500">No tournaments available yet.</p>
                `;
            }

            const current = this.state.tournaments[0];
            const daysHtml = Array.from({length: 15}, (_, i) => {
                const day = i + 1;
                const dayInfo = current.days?.find(d => d.day === day);
                const hasData = dayInfo?.has_preview || dayInfo?.has_results;

                if (hasData) {
                    return `
                        <button data-basho="${current.id}" data-day="${day}"
                            class="w-12 h-12 flex items-center justify-center border border-gray-300 rounded text-gray-900 hover:bg-gray-100 font-medium cursor-pointer">
                            ${day}
                        </button>
                    `;
                } else {
                    return `
                        <span class="w-12 h-12 flex items-center justify-center border border-gray-200 rounded text-gray-300">
                            ${day}
                        </span>
                    `;
                }
            }).join('');

            return `
                <h1 class="text-3xl font-bold text-gray-900 mb-8">TachiAI</h1>
                <p class="text-gray-500 mb-6">${this.getBashoName(current.id)}</p>
                <div class="grid grid-cols-5 gap-2 max-w-xs">
                    ${daysHtml}
                </div>
            `;
        },

        renderPreview() {
            const data = this.state.data;
            if (!data) {
                return '<div class="text-gray-500">No preview data available.</div>';
            }

            const day = data.day;
            const basho = data.basho_id;
            const bashoName = this.getBashoName(basho);

            // Navigation - check if next day has data
            const tournament = this.state.tournaments.find(t => t.id === basho);
            const nextDayInfo = tournament?.days?.find(d => d.day === day + 1);
            const hasNextDay = nextDayInfo?.has_preview || nextDayInfo?.has_results;

            const prevLink = day > 1
                ? `<a href="#" data-nav="${basho}/${day-1}/preview" class="text-sm text-gray-500 hover:text-gray-900">&larr; Day ${day-1}</a>`
                : '<span></span>';
            const nextLink = day < 15 && hasNextDay
                ? `<a href="#" data-nav="${basho}/${day+1}/preview" class="text-sm text-gray-500 hover:text-gray-900">Day ${day+1} &rarr;</a>`
                : '<span></span>';

            // Yusho race
            let yushoHtml = '';
            if (data.yusho_race?.contenders?.length > 0) {
                const contendersHtml = data.yusho_race.contenders.map(c => `
                    <div class="grid grid-cols-[8rem_auto] text-sm py-2 border-b border-gray-200">
                        <span class="font-medium">${c.name}</span>
                        <span class="text-gray-600">${c.record}</span>
                    </div>
                `).join('');

                yushoHtml = `
                    <div class="mb-8 mt-6">
                        <p class="text-sm text-gray-500 mb-3">With ${data.yusho_race.days_remaining} days left</p>
                        <div class="inline-block">${contendersHtml}</div>
                    </div>
                `;
            }

            // Bouts
            const boutsHtml = data.bouts.map(bout => this.renderBout(bout)).join('');

            return `
                <div class="sticky top-0 bg-white z-10 pb-2">
                    <div class="mb-4 pt-4">
                        <a href="#" data-nav="home" class="text-sm text-gray-500 hover:text-gray-900">&larr; TachiAI</a>
                    </div>

                    <div class="flex items-baseline justify-between mb-4">
                        ${prevLink}
                        <h1 class="text-2xl font-bold text-gray-900">Day ${day} <span class="font-normal text-gray-500">${bashoName}</span></h1>
                        ${nextLink}
                    </div>

                    <div class="flex gap-4 border-b border-gray-200">
                        <span class="pb-2 border-b-2 border-gray-900 font-medium text-gray-900">Preview</span>
                        <a href="#" data-nav="${basho}/${day}/results" class="pb-2 text-gray-500 hover:text-gray-900">Results</a>
                    </div>
                </div>

                ${yushoHtml}

                <div class="mb-8">
                    <h2 class="text-lg font-bold text-gray-900 mb-4">Bouts</h2>
                    <div>${boutsHtml}</div>
                </div>

                <nav class="flex justify-between text-sm py-6">
                    ${prevLink}
                    ${nextLink}
                </nav>
            `;
        },

        renderBout(bout) {
            const pct = Math.round(bout.p_east * 100);

            // Labels
            let labelsHtml = '';
            if (bout.is_bout_of_day) {
                labelsHtml += '<span class="text-xs text-indigo-500 uppercase tracking-wide">Bout of the Day</span>';
            } else if (bout.is_must_watch) {
                labelsHtml += '<span class="text-xs text-indigo-500 uppercase tracking-wide">Must Watch</span>';
            }
            if (bout.is_belt_battle) {
                labelsHtml += '<span class="text-xs text-indigo-500 uppercase tracking-wide">Belt Battle</span>';
            } else if (bout.is_pushing_match) {
                labelsHtml += '<span class="text-xs text-indigo-500 uppercase tracking-wide">Pushing Match</span>';
            }

            // Form indicators
            const eastFormHtml = bout.east_form ? this.renderForm(bout.east_form, 'east') : '';
            const westFormHtml = bout.west_form ? this.renderForm(bout.west_form, 'west') : '';

            // H2H
            const h2hHtml = bout.h2h_total > 0
                ? `${bout.h2h_east_wins}-${bout.h2h_west_wins}`
                : '&mdash;';

            // Probability bar
            let barHtml;
            if (pct >= 50) {
                barHtml = `<div class="absolute top-0 bottom-0 right-1/2 bg-indigo-500" style="width: ${pct - 50}%"></div>`;
            } else {
                barHtml = `<div class="absolute top-0 bottom-0 left-1/2 bg-indigo-500" style="width: ${50 - pct}%"></div>`;
            }

            // Storylines
            const storylinesHtml = bout.storylines?.length > 0
                ? `<div class="text-center space-y-1 mt-2">${bout.storylines.map(s => `<p class="text-xs text-gray-500">${s}</p>`).join('')}</div>`
                : '';

            return `
                <div class="py-4 border-b border-gray-300">
                    <div class="flex items-center gap-1.5 mb-2">
                        <span class="text-xs text-gray-400">#${bout.bout_number}</span>
                        ${labelsHtml}
                    </div>

                    <div class="flex items-center mb-1">
                        <div class="relative h-1 bg-gray-100 flex-1">
                            <div class="absolute top-0 bottom-0 left-1/2 w-px bg-gray-300"></div>
                            ${barHtml}
                        </div>
                    </div>

                    <div class="grid grid-cols-[1fr_auto_1fr] items-baseline">
                        <div class="text-right pr-2">
                            ${pct >= 50 ? `<span class="text-xs text-indigo-500">${pct}%</span> ` : ''}<span class="font-medium text-gray-900">${bout.east_name}</span>
                        </div>
                        <div class="text-xs text-gray-400 px-1">${h2hHtml}</div>
                        <div class="text-left pl-2">
                            <span class="font-medium text-gray-900">${bout.west_name}</span>${pct < 50 ? ` <span class="text-xs text-indigo-500">${100 - pct}%</span>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-[1fr_auto_1fr] text-xs text-gray-400">
                        <div class="text-right pr-2">${bout.east_rank}</div>
                        <div class="w-8"></div>
                        <div class="text-left pl-2">${bout.west_rank}</div>
                    </div>

                    <div class="grid grid-cols-[1fr_auto_1fr] text-xs text-gray-500">
                        <div class="text-right pr-2">${eastFormHtml}</div>
                        <div class="w-8"></div>
                        <div class="text-left pl-2">${westFormHtml}</div>
                    </div>

                    ${bout.east_style || bout.west_style ? `
                    <div class="grid grid-cols-[1fr_auto_1fr] text-xs text-indigo-500">
                        <div class="text-right pr-2">${bout.east_style || ''}</div>
                        <div class="w-8"></div>
                        <div class="text-left pl-2">${bout.west_style || ''}</div>
                    </div>
                    ` : ''}

                    ${storylinesHtml}
                </div>
            `;
        },

        renderForm(form, side) {
            if (!form || !form.record) return '';

            const dotsHtml = form.last_3?.map(r => r === 'W' ? '&#9679;' : '&#9675;').join('') || '';

            if (side === 'east') {
                return `<span>${form.record}</span>${dotsHtml ? `<span class="ml-1">${dotsHtml}</span>` : ''}`;
            } else {
                return `${dotsHtml ? `<span>${dotsHtml}</span>` : ''}<span class="ml-1">${form.record}</span>`;
            }
        },

        renderResults() {
            const data = this.state.data;
            if (!data || !data.results) {
                return '<div class="text-gray-500">No results data available.</div>';
            }

            const day = data.day;
            const basho = data.basho_id;
            const bashoName = this.getBashoName(basho);

            // Navigation - check if next day has data
            const tournament = this.state.tournaments.find(t => t.id === basho);
            const nextDayInfo = tournament?.days?.find(d => d.day === day + 1);
            const hasNextDay = nextDayInfo?.has_results;

            const prevLink = day > 1
                ? `<a href="#" data-nav="${basho}/${day-1}/results" class="text-sm text-gray-500 hover:text-gray-900">&larr; Day ${day-1}</a>`
                : '<span></span>';
            const nextLink = day < 15 && hasNextDay
                ? `<a href="#" data-nav="${basho}/${day+1}/results" class="text-sm text-gray-500 hover:text-gray-900">Day ${day+1} &rarr;</a>`
                : '<span></span>';

            // Upsets
            let upsetsHtml = '';
            if (data.upsets?.length > 0) {
                const upsetItemsHtml = data.upsets.map(u => `
                    <div class="py-3 border-b border-gray-100">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-gray-400 line-through">${u.east_name === u.winner ? u.west_name : u.east_name}</span>
                            <span class="text-gray-400">&rarr;</span>
                            <span class="font-medium">${u.winner}</span>
                        </div>
                        <div class="text-sm text-gray-500">
                            ${u.kimarite} &middot; ${Math.round(u.upset_magnitude * 100)}% favorite lost
                        </div>
                    </div>
                `).join('');

                upsetsHtml = `
                    <div class="mb-8">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">Upsets</h2>
                        <div class="space-y-3">${upsetItemsHtml}</div>
                    </div>
                `;
            }

            // Results table
            const resultsRowsHtml = data.results.map(r => `
                <tr class="border-b border-gray-100">
                    <td class="py-2 text-gray-400">${r.bout_number}</td>
                    <td class="py-2">
                        <span class="text-xs text-gray-400 block">${r.east_rank}</span>
                        <span class="${r.winner === r.east_name ? 'font-medium' : 'text-gray-500'}">${r.east_name}</span>
                    </td>
                    <td class="py-2">
                        <span class="text-xs text-gray-400 block">${r.west_rank}</span>
                        <span class="${r.winner === r.west_name ? 'font-medium' : 'text-gray-500'}">${r.west_name}</span>
                    </td>
                    <td class="py-2 font-medium">${r.winner}</td>
                    <td class="py-2 text-center">${r.predicted_correct ? '&#10003;' : '&#10007;'}</td>
                </tr>
            `).join('');

            // Standings
            let standingsHtml = '';
            if (data.standings?.length > 0) {
                const standingsRowsHtml = data.standings.map((s, i) => `
                    <tr class="border-b border-gray-100">
                        <td class="py-2 text-gray-400">${i + 1}</td>
                        <td class="py-2 font-medium">${s.name}</td>
                        <td class="py-2 text-gray-600">${s.wins}-${s.losses}</td>
                    </tr>
                `).join('');

                standingsHtml = `
                    <div class="mb-8">
                        <h2 class="text-lg font-bold text-gray-900 mb-1">Standings</h2>
                        <p class="text-sm text-gray-500 mb-4">Through Day ${day}</p>
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-gray-500 border-b border-gray-200">
                                    <th class="pb-2 font-medium">#</th>
                                    <th class="pb-2 font-medium">Wrestler</th>
                                    <th class="pb-2 font-medium">Record</th>
                                </tr>
                            </thead>
                            <tbody>${standingsRowsHtml}</tbody>
                        </table>
                    </div>
                `;
            }

            return `
                <div class="sticky top-0 bg-white z-10 pb-2">
                    <div class="mb-4 pt-4">
                        <a href="#" data-nav="home" class="text-sm text-gray-500 hover:text-gray-900">&larr; TachiAI</a>
                    </div>

                    <div class="flex items-baseline justify-between mb-4">
                        ${prevLink}
                        <h1 class="text-2xl font-bold text-gray-900">Day ${day} <span class="font-normal text-gray-500">${bashoName}</span></h1>
                        ${nextLink}
                    </div>

                    <div class="flex gap-4 border-b border-gray-200">
                        <a href="#" data-nav="${basho}/${day}/preview" class="pb-2 text-gray-500 hover:text-gray-900">Preview</a>
                        <span class="pb-2 border-b-2 border-gray-900 font-medium text-gray-900">Results</span>
                    </div>
                </div>

                <div class="mb-8 mt-6 text-center">
                    <div class="text-4xl font-bold text-gray-900 mb-1">${Math.round(data.accuracy)}%</div>
                    <div class="text-sm text-gray-500">correct predictions</div>
                </div>

                ${upsetsHtml}

                <div class="mb-8">
                    <h2 class="text-lg font-bold text-gray-900 mb-4">All Results</h2>
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-left text-gray-500 border-b border-gray-200">
                                <th class="pb-2 font-medium">#</th>
                                <th class="pb-2 font-medium">East</th>
                                <th class="pb-2 font-medium">West</th>
                                <th class="pb-2 font-medium">Winner</th>
                                <th class="pb-2 font-medium text-center">Pred</th>
                            </tr>
                        </thead>
                        <tbody>${resultsRowsHtml}</tbody>
                    </table>
                </div>

                ${standingsHtml}

                <nav class="flex justify-between text-sm py-6">
                    ${prevLink}
                    ${nextLink}
                </nav>
            `;
        }
    };

    // Initialize app
    document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
