<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TachiAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="min-h-screen bg-white text-gray-900">
    <main class="max-w-2xl mx-auto px-4 py-12">
        
<h1 class="text-2xl font-bold text-gray-900 mb-1">TachiAI</h1>
<p class="text-gray-500 mb-8">Sumo bout previews and results</p>


<div class="mb-8">
    <label class="block text-xs text-gray-500 uppercase tracking-wide mb-2">Tournament</label>
    <select id="basho-selector" class="w-full px-3 py-2 border border-gray-300 rounded text-gray-900 focus:outline-none focus:border-gray-500">
        
        <option value="2025-01" selected>2025 Hatsu Basho (January)</option>
        
        <option value="2026-01">2026 Hatsu Basho (January)</option>
        
    </select>
</div>



<div id="days-list" class="space-y-3">
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    <div class="flex items-center justify-between py-3 border-b border-gray-100" data-day="7">
        <span class="text-gray-900 font-medium">Day 7</span>
        <div class="flex gap-4">
            
            <a href="2025-01/day-07-preview.html" class="preview-link text-gray-500 hover:text-gray-900 text-sm">Preview</a>
            
            
        </div>
    </div>
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
</div>


    </main>

    

<script>
document.addEventListener('DOMContentLoaded', function() {
    const bashoSelector = document.getElementById('basho-selector');
    const dayRows = document.querySelectorAll('[data-day]');

    bashoSelector.addEventListener('change', function() {
        const basho = this.value;
        dayRows.forEach(row => {
            const day = row.dataset.day;
            const previewLink = row.querySelector('.preview-link');
            const resultsLink = row.querySelector('.results-link');
            previewLink.href = `${basho}/day-${day.padStart(2, '0')}-preview.html`;
            resultsLink.href = `${basho}/day-${day.padStart(2, '0')}-results.html`;
        });
    });
});
</script>


</body>
</html>
